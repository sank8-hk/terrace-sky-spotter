<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrace Sky Spotter — what's up over Bengaluru tonight</title>
<style>
  :root { color-scheme: light dark; --acc: #5b5bd6; }
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.6rem; } h1 small { font-weight: normal; font-size: 1rem; opacity: .7; }
  .badge { display: inline-block; font-size: .75rem; background: #e8eaf6; color: #283593; border-radius: 20px; padding: .1rem .6rem; }
  @media (prefers-color-scheme: dark) { .badge { background: #23234d; color: #b9b9f5; } }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #ccc; font-size: .95rem; }
  tr[data-name] { cursor: pointer; } tr[data-name]:hover { background: rgba(91,91,214,.08); }
  button { padding: .6rem 1.2rem; font-size: 1rem; background: var(--acc); color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  #tour, #detail { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
  #tour h2 { font-size: 1.1rem; color: var(--acc); }
  #status { font-size: .9rem; min-height: 1.4em; opacity: .8; }
</style>
</head>
<body>
<h1>🔭 Terrace Sky Spotter <small>what's up over Bengaluru tonight</small></h1>
<p><span class="badge">open star catalogs</span> <span class="badge">open-weight Gemma, local</span> <span class="badge">no GPS · no cloud</span></p>
<p id="health">Checking local model…</p>

<h2>Tonight <span id="for"></span></h2>
<p>Computed on this device from date + coordinates — tap a row to ask Gemma how to find it.</p>
<table><thead><tr><th>Constellation</th><th>Anchor ⭐</th><th>Height</th><th>Look</th></tr></thead>
<tbody id="rows"><tr><td colspan="4">Loading the sky…</td></tr></tbody></table>

<button id="go">Narrate my tour with Gemma ✨</button>
<p id="status"></p>
<div id="tour" hidden></div>
<div id="detail" hidden></div>

<script>
const $ = id => document.getElementById(id);
fetch('/api/health').then(r => r.json()).then(h => {
  $('health').textContent = h.ok ? `✅ ${h.model} ready — your location never leaves this machine.`
    : `⚠️ Model '${h.model}' not found. Run: ollama pull ${h.model || 'gemma3:1b'}`;
}).catch(() => { $('health').textContent = '⚠️ Cannot reach Ollama at localhost:11434.'; });

function md(src) {
  return src.replace(/^## (.*)$/gm, '<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^- (.*)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, m => '<ul>' + m + '</ul>').replace(/\n/g, '<br>');
}
fetch('/api/tonight').then(r => r.json()).then(d => {
  $('for').textContent = '(' + d.for + ', 12.97°N 77.59°E)';
  $('rows').innerHTML = d.visible.map(c =>
    `<tr data-name="${c.name}"><td><strong>${c.name}</strong><br><small>${c.hint}</small></td><td>${c.star}</td><td>${c.alt}°</td><td>${c.dir}</td></tr>`).join('');
  document.querySelectorAll('tr[data-name]').forEach(tr => tr.addEventListener('click', () => detail(tr.dataset.name)));
});
async function detail(name) {
  const box = $('detail'); box.hidden = false; box.innerHTML = `<em>Gemma is looking up ${name}…</em>`;
  const res = await fetch('/api/detail', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name }) });
  box.innerHTML = '<h2>' + name + '</h2>' + md(await res.text());
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
$('go').addEventListener('click', async () => {
  $('go').disabled = true; const box = $('tour'); box.hidden = false; box.innerHTML = '';
  $('status').textContent = 'Gemma is writing your tour… (~30s on CPU)';
  const res = await fetch('/api/tour', { method: 'POST' });
  box.innerHTML = md(await res.text());
  $('status').textContent = 'Done — now go outside! 🌌';
  $('go').disabled = false;
});
</script>
</body>
</html>
